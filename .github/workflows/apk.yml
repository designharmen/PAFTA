# PAFTA'yı kurulabilir bir uygulama dosyası (APK) haline getirir.
#
# Bu dosya, GitHub'ın kendi bilgisayarlarında çalışır. Orada Android araçları
# hazır kurulu olduğu için, geliştirme ortamında yapılamayan derleme burada
# yapılabiliyor. Sonuçta çıkan APK, GitHub sayfasından indirilebilir hale gelir.
#
# Builds PAFTA into an installable APK on GitHub's runners, which have the
# Android SDK preinstalled — the step the development container cannot perform.

name: PAFTA APK

on:
  push:
    branches:
      - "claude/**"
      - main
  # "Run workflow" düğmesiyle elle de başlatılabilir.
  workflow_dispatch:

permissions:
  # Kurulum dosyasını "sürüm" olarak yayınlayabilmek için yazma izni gerekiyor;
  # uygulamanın içindeki GÜNCELLE tuşu tam olarak oradan indiriyor.
  contents: write

jobs:
  build:
    name: Derle ve APK üret
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: Android araçlarını hazırla
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # Bütün derlemelerin aynı anahtarla imzalanması için, depodaki şifreli
      # anahtar burada çözülüyor. Şifre GitHub'ın gizli değerinde duruyor;
      # ne depoda, ne kayıtta, ne de kurulum dosyasının içinde geçiyor.
      #
      # Şifre eklenmemişse derleme yine de sürüyor, ama sürüm YAYINLANMIYOR:
      # farklı anahtarla imzalanmış bir dosya kurulurken "uygulama yüklenmedi"
      # der, ve sessizce öyle bir dosya yayınlamak hatayı geri getirmek olur.
      - name: İmza anahtarını çöz
        id: imza
        env:
          PAFTA_IMZA_SIFRESI: ${{ secrets.PAFTA_IMZA_SIFRESI }}
        run: |
          if [ -z "${PAFTA_IMZA_SIFRESI:-}" ]; then
            echo "imzali=hayir" >> "$GITHUB_OUTPUT"
            echo "::warning::PAFTA_IMZA_SIFRESI gizli değeri eklenmemiş. APK imzasız üretilecek ve sürüm yayınlanmayacak."
            {
              echo "## İmza anahtarı yok"
              echo
              echo "Depo ayarlarında **PAFTA_IMZA_SIFRESI** gizli değeri tanımlı değil."
              echo "Kurulum dosyası üretildi ama sürüm olarak yayınlanmadı."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 240000 \
            -in imza/pafta-imza.p12.enc \
            -out "${RUNNER_TEMP}/pafta-imza.p12" \
            -pass env:PAFTA_IMZA_SIFRESI
          echo "imzali=evet" >> "$GITHUB_OUTPUT"

      # Türkçe metin dosyasının denetimi. Saniyeler sürer ve Android'in kaynak
      # derleyicisinin dört dakika sonra bulacağı hataları hemen yakalar.
      - name: Türkçe metinleri denetle
        run: python3 tools/check-strings.py

      # Sonra saf Kotlin çekirdeğinin testleri. Bunlar Android gerektirmez, bu
      # yüzden bir hata varsa APK'yi beklemeden burada görülür.
      - name: Çekirdek testleri
        run: ./gradlew -PpaftaCoreOnly=true test --console=plain

      # Asıl sınav: Android tarafı gerçekten derleniyor mu?
      #
      # Çıktı bir dosyaya da yazılıyor; hata olursa bir sonraki adım yalnızca
      # hata satırlarını, günlüğün en sonunda, okunabilir biçimde yazdırıyor.
      # (`--stacktrace` bilerek yok: yüzlerce satır teknik iz, hatanın kendisini
      # görünmez yapıyordu.)
      # Yapım numarası uygulamanın içine gömülüyor: kütüphane ekranının sağ
      # üstünde görünüyor, böylece "hangi sürümü kurdum?" sorusu tahmine
      # kalmıyor. Bu sayfadaki liste numarasıyla birebir aynı.
      - name: APK derle
        env:
          PAFTA_IMZA_SIFRESI: ${{ secrets.PAFTA_IMZA_SIFRESI }}
        run: |
          set -o pipefail
          imza=""
          if [ "${{ steps.imza.outputs.imzali }}" = "evet" ]; then
            imza="-PpaftaKeystore=${RUNNER_TEMP}/pafta-imza.p12"
          fi
          ./gradlew assembleDebug -PpaftaBuild="${GITHUB_RUN_NUMBER}" $imza --console=plain 2>&1 \
            | tee "${RUNNER_TEMP}/build.log"

      # Hata özeti: günlüğün sonunda, sadece işe yarayan satırlar.
      - name: Derleme hatalarını özetle
        if: failure()
        run: |
          log="${RUNNER_TEMP}/build.log"
          if [ ! -f "$log" ]; then
            echo "(derleme günlüğü yok — hata derlemeden önce oluştu)"
            exit 0
          fi

          summary="${RUNNER_TEMP}/errors.txt"
          {
            # Derleyici hataları.
            grep -E '^e: |^w: |error:|warning:|^> Task .* FAILED|Execution failed|Caused by: [A-Za-z]' "$log" \
              | grep -v 'See log for more details' || true
            # "What went wrong" başlığının ALTINDAKİ satırlar. Kaynak birleştirme
            # hatası (aynı isimli iki metin gibi) sebebini yalnızca orada yazıyor;
            # sadece başlığı almak bir derlemeye mal oldu.
            grep -A 10 -E '^\* What went wrong' "$log" || true
          } | head -n 140 > "$summary" || true

          echo "===== DERLEME HATALARI ====="
          if [ -s "$summary" ]; then
            cat "$summary"
          else
            echo "(eşleşen hata satırı yok; son 40 satır:)"
            tail -n 40 "$log"
          fi
          echo "===== SON ====="

          # Aynı özeti GitHub'ın iş özeti sayfasına da koy.
          {
            echo "## Derleme hataları"
            echo '```'
            cat "$summary" 2>/dev/null || echo "(yok)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uygulamanın kendini güncelleyebilmesi için kurulum dosyası bir "sürüm"
      # olarak yayınlanıyor. GitHub'ın "artifact" dosyaları şifre istiyor,
      # sürüm dosyaları istemiyor — uygulamanın içine hiçbir şifre gömmemenin
      # tek yolu bu.
      #
      # Etiket yapım numarasıyla aynı (yapim-12): uygulama kendi damgasıyla
      # karşılaştırıp yeni sürüm olup olmadığını böyle anlıyor.
      - name: Sürüm olarak yayınla
        if: success() && steps.imza.outputs.imzali == 'evet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="yapim-${GITHUB_RUN_NUMBER}"
          file="PAFTA-${tag}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$file"

          konu="$(git log -1 --pretty=%s)"
          notlar="$(printf '%s\n\n%s\n' \
            "Bu dosyayı elle indirmene gerek yok: PAFTA'daki GÜNCELLE tuşu buradan alır." \
            "Değişiklik: ${konu}")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" \
              --title "yapım ${GITHUB_RUN_NUMBER}" \
              --notes "$notlar" \
              --latest
          fi

      - name: APK'yi yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PAFTA-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Test raporları, derleme başarısız olsa bile işe yarar.
      - name: Test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: core/*/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
